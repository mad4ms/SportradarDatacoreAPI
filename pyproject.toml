[project]
name = "sportradar-datacore-api"
version = "0.1.3"
description = "A Python wrapper for accessing and processing Sportradar DataCore data."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Michael Adams", email = "m@ad4ms.de" }]

keywords = ["handball", "sportradar", "api", "data", "wrapper"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
]

dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "typing-extensions>=4.16.0",
    "pandas>=3.0.5",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "attrs>=26.1.0",
]

[project.optional-dependencies]
stream = [
    "paho-mqtt>=2.1",
]

dev = [
    "openapi-python-client==0.26.1",
    "openapi-spec-validator>=0.7",
    "pytest>=8.4",
    "pytest-order>=1.3",
    "pytest-cov>=4.1",
    "respx>=0.21",
    "ruff==0.5.7",
    "mypy>=1.10",
    "pre-commit>=4.5.1",
]

[project.urls]
Homepage = "https://github.com/mad4ms/SportradarDatacoreAPI"
Repository = "https://github.com/mad4ms/SportradarDatacoreAPI"

# --- packaging ---
[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["sportradar_datacore_api*", "datacore_client*"]

# --- build ---
[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

# --- Ruff ---
[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [".venv", "src/datacore_client"]

[tool.ruff.lint]
select = ["E","F","I","UP","B","SIM","PGH","PL","RUF"]
ignore = ["E203"]  # formatter compatibility

[tool.ruff.lint.isort]
known-first-party = ["sportradar_datacore_api"]

[tool.ruff.format]

# --- pytest ---
[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q -ra --maxfail=1"
testpaths = ["test"]

# --- mypy ---
[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]

mypy_path = ["src"]

exclude = ["^src/datacore_client/"]

warn_unused_ignores = true
warn_redundant_casts = true
strict_optional = true
check_untyped_defs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "datacore_client.*"
follow_imports = "skip"
ignore_errors = true
